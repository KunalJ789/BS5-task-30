<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12. Badges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container m-5">
        <h2>Badges</h2>
        <h1><span class="badge bg-primary">New Notification</span></h1>
        <h1><span class="badge bg-secondary">Pending</span></h1>
        <h1><span class="badge bg-info">Completed</span></h1>
        <h1><span class="badge bg-danger">Important</span></h1>
    </div>
</body>

</html>
